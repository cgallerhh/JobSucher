name: Daily Job Search

on:
  # Manual fallback only. The reliable daily schedule is the real local cron
  # installed with scripts/install_cron.sh.
  workflow_dispatch:

concurrency:
  group: job-search
  cancel-in-progress: false   # never cancel a running search

jobs:
  search:
    name: Scrape & send daily digest
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit seen_jobs.json back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m job_search.main

      # Persist the deduplication state so jobs are never sent twice
      - name: Save seen-jobs state
        if: always()   # run even if the email step fails
        run: |
          git config user.name  "job-search-bot"
          git config user.email "noreply@github.com"
          git add data/seen_jobs.json
          # Only commit if there are actual changes
          git diff --staged --quiet && echo "No changes to seen_jobs.json" || \
            git commit -m "chore: update seen_jobs [skip ci]"
          # Pull first to avoid push conflicts
          git pull --rebase origin main || true
          git push origin HEAD || true
